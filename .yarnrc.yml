compressionLevel: mixed

enableGlobalCache: true

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.13.0.cjs

# Accepted `yarn npm audit -AR` findings. See
# docs/maintenance/deferred-upgrades.md for the full rationale and the version
# floors that unblock each group.
#
# These are listed as individual advisory IDs rather than via
# npmAuditExcludePackages on purpose: excluding a package masks its *future*
# advisories too, and for `next` and `vite` that would hide genuinely
# actionable alerts against test/next16 (Next 16.x) and the vitest 3/4 chains
# (vite 7/8). Suppressing by ID keeps every new advisory visible.
#
# Nothing here reaches the published `dist/`:
#   yarn npm audit -R --environment production  =>  No audit suggestions
#
# Every block below carries a REMOVE WHEN line naming the version floor that
# retires it. Blocks are deleted wholesale, not audited entry by entry.
npmAuditIgnoreAdvisories:
  # vitest 0.34.6 / 1.6.1 / 2.1.9 (test/vitest, test/vitest1, test/vitest2)
  # GHSA-5xrq-8626-4rwp, critical. No fix exists on these lines - upstream
  # fixed it in 3.2.6 and 4.1.0 only, and each of these is the final release
  # of its major. Requires the Vitest UI server to be listening; never started.
  # REMOVE WHEN: support for vitest < 3 is dropped.
  - "1139528"

  # various next 14.x advisories
  # REMOVE WHEN: support for next 14 is dropped.
  - "1112593"
  - "1112653"
  - "1114897"
  - "1114940"
  - "1116376"
  - "1117931"
  - "1118942"
  - "1118944"
  - "1118946"
  - "1118948"
  - "1118952"
  - "1118954"
  - "1118958"
  - "1118962"
  - "1124172"
  - "1124185"
  - "1124187"
  - "1124189"
  - "1124191"
  - "1124193"
  - "1124197"
  - "1193677"
  - "1193733"

  # vite 5.4.21, pinned by vitest 0.34.6 (`^3.1.0 || ^4.0.0 || ^5.0.0-0`) and
  # 1.6.1 (`^5.0.0`). 5.4.21 is the last 5.x; fixes land in 6.4.3+.
  # REMOVE WHEN: support for vitest < 3 is dropped.
  - "1116229"
  - "1120784"
  - "1123525"

  # esbuild 0.21.5, pinned by vite 5.4.21 (`^0.21.3`).
  # REMOVE WHEN: support for vitest < 3 is dropped.
  - "1102341"

  # @vitest/mocker < 4
  # REMOVE WHEN: support for vitest < 4 is dropped.
  - "1193684"

  # vitest < 4 advisories
  # REMOVE WHEN: support for vitest < 4 is dropped.
  - "1193683"

  # tinypool 0.7.0 / 0.8.4 / 1.1.1, prototype-pollution gadgets to RCE
  # (critical). Fixed in 2.1.2, which no vitest before 4 can take: 0.34.6 pins
  # `^0.7.0`, 1.6.1 `^0.8.3`, 2.1.9 `^1.0.1` and 3.2.7 (latest 3.x) `^1.1.1`,
  # and 1.1.1 is the last 1.x. vitest 4 dropped tinypool entirely. A
  # `resolutions` override is blocked twice over: tinypool 2.x is a major API
  # bump, and it declares `engines.node: ^20.0.0 || >=22.0.0` while we declare
  # `>=18` and CI covers Node 18. Both gadgets need attacker-controlled worker
  # options; these workspaces run fixed vitest configs.
  # REMOVE WHEN: support for vitest < 4 is dropped.
  - "1241260"
  - "1241261"

  # braces 3.0.3 via micromatch 4.0.8 (jest, semantic-release) and chokidar
  # 3.6.0. GHSA-vfj7-8cjw-p6xm, high, stack exhaustion on deeply nested
  # patterns. No fixed version exists - 3.0.3 is the latest release and the
  # advisory range is `<=3.0.3`; micromatch@latest still pins `^3.0.3`.
  # REMOVE WHEN: braces publishes a fix. There is no version floor to wait on.
  - "1240992"

  # sprintf-js 1.0.3, DoS via unbounded precision specifiers (moderate).
  # Same shape: 1.1.3 is the latest release and the advisory range is `<=1.1.3`,
  # so no fixed version exists on any line. Reached only through
  # argparse 1.0.10 -> js-yaml 3.15.2 -> @istanbuljs/load-nyc-config ->
  # babel-plugin-istanbul, i.e. jest's coverage instrumentation.
  # REMOVE WHEN: sprintf-js publishes a fix.
  - "1241202"

  # serialize-javascript 6.0.2 via mocha. No released mocha allows the fix:
  # 10.8.2 and 11.8.0 both pin `^6.0.2`, only mocha 12.0.0-rc.6 moves to
  # `^7.0.2`. A resolution override is blocked too - serialize-javascript 7.x
  # declares `engines.node: >=20.0.0` and we still support Node 18. Only
  # reachable from mocha's parallel-mode workers, which test/mocha never uses.
  # REMOVE WHEN: engines.node floor reaches 20 (then bump mocha and drop the
  # `resolutions` block on it, or override serialize-javascript to ^7.1.0).
  - "1113686"
  - "1119440"

  # Deprecation notices with no available successor.
  # prebuild-install: unmaintained, 7.1.3 is latest, sqlite3 6.x needs it too.
  #   REMOVE WHEN: never, unless upstream sqlite3 changes build tooling.
  # glob 10.5.0: via node-gyp 11 -> make-fetch-happen -> cacache 19. node-gyp
  #   12 drops that subtree entirely but needs Node >=20.17.
  #   REMOVE WHEN: engines.node floor reaches 20.17, then drop the node-gyp
  #   `resolutions` pin (or move it to ^12) and this clears itself.
  # inflight: via mocha's glob 8.1.0. mocha 11 moves to glob ^10.4.5, which
  #   only swaps this notice for the glob one above.
  #   REMOVE WHEN: mocha is bumped past 10.x.
  - "prebuild-install (deprecation)"
  - "glob (deprecation)"
  - "inflight (deprecation)"
